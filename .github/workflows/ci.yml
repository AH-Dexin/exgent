name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [fmt, clippy, test]
        include:
          - os: macos-latest
            task: test
          - os: windows-latest
            task: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.task == 'fmt' && 'rustfmt' || (matrix.task == 'clippy' && 'clippy' || '') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.task }}-

      - name: Format check
        if: matrix.task == 'fmt'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --no-deps

      - name: Test
        if: matrix.task == 'test'
        run: cargo test --workspace --no-fail-fast
